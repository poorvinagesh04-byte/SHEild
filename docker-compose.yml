services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shield}
      MYSQL_USER: ${MYSQL_USER:-shield}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shield_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-shield}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER:-shield}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shield_dev_password}
      SHEILD_STORAGE_DIR: /app/data/evidence
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - evidence_data:/app/data/evidence

volumes:
  db_data:
  evidence_data:
