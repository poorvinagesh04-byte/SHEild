spring.application.name=SHEild
server.port=${PORT:8080}

# --- MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/shield?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:shield}
spring.datasource.password=${DB_PASSWORD:shield_dev_password}
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.enabled=true
sheild.storage-dir=${SHEILD_STORAGE_DIR:./data/evidence}
sheild.max-evidence-bytes=10485760

# --- Errors ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Forward API 404s as JSON, keep static assets normal ---
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
